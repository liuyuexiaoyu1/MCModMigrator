name: Build and Release

on:
  push: {}
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Read version constant
        id: version
        run: |
          echo "version=$(python -c "import mc_migrator; print(mc_migrator.__version__)")" >> $GITHUB_OUTPUT

      - name: Run unit tests
        run: python tests/test_core.py

      - name: Build exe
        run: python -m PyInstaller --onefile --windowed --clean --noconfirm --name "MCModMigrator-${{ steps.version.outputs.version }}" mod_migrator.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCModMigrator-${{ steps.version.outputs.version }}
          path: dist/MCModMigrator-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

  release:
    name: Upload exe to Release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MCModMigrator-${{ needs.build.outputs.version }}*
          path: release-dist
          merge-multiple: true

      - name: Upload exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release-dist/MCModMigrator-${{ needs.build.outputs.version }}.exe --clobber
