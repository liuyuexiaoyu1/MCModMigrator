name: Build and Release

on:
  push: {}
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Linux Qt libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxkbcommon0 libgl1 libegl1 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-render-util0

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Read version constant
        id: version
        shell: bash
        run: echo "version=$(python -c 'import mc_migrator; print(mc_migrator.__version__)')" >> $GITHUB_OUTPUT

      - name: Run unit tests
        shell: bash
        run: python tests/test_core.py

      - name: Build binary
        shell: bash
        run: python -m PyInstaller --onefile --windowed --clean --noconfirm --name "MCModMigrator-${{ steps.version.outputs.version || '0.0.0' }}" mod_migrator.py

      - name: Rename Linux binary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: mv "dist/MCModMigrator-${{ steps.version.outputs.version || '0.0.0' }}" "dist/MCModMigrator-${{ steps.version.outputs.version || '0.0.0' }}-linux"

      - name: Package macOS app
        if: matrix.os == 'macos-latest'
        shell: bash
        run: cd dist && zip -r "MCModMigrator-${{ steps.version.outputs.version || '0.0.0' }}-macos.zip" "MCModMigrator-${{ steps.version.outputs.version || '0.0.0' }}.app"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCModMigrator-${{ steps.version.outputs.version || '0.0.0' }}-${{ matrix.os }}
          path: |
            dist/MCModMigrator-${{ steps.version.outputs.version || '0.0.0' }}.exe
            dist/MCModMigrator-${{ steps.version.outputs.version || '0.0.0' }}-macos.zip
            dist/MCModMigrator-${{ steps.version.outputs.version || '0.0.0' }}-linux
          if-no-files-found: error

  release:
    name: Upload binaries to Release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MCModMigrator-*
          path: release-dist
          merge-multiple: true

      - name: Upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release-dist/* --clobber
